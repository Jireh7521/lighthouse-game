name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and gameplay tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: docs/ matches src/
        run: npm run check
      - name: Gameplay tests
        run: node tests/run.mjs
