<!doctype html><meta charset=utf-8><title>phone frames</title>
<body style="margin:0;background:#16181d;color:#dfe6f2;font:13px monospace;padding:10px">
<div style="display:flex;gap:18px;align-items:flex-start">
  <div><div style="padding-bottom:6px">upright 360x780, scaled 1.5x</div>
    <iframe src="zzport.html" width="360" height="780" style="border:1px solid #39405a;display:block;transform:scale(1.5);transform-origin:0 0;margin-bottom:400px"></iframe></div>
  <div><div style="padding-bottom:6px">sideways 780x360, scaled 1.5x</div>
    <iframe src="zzport.html" width="780" height="360" style="border:1px solid #39405a;display:block;transform:scale(1.15);transform-origin:0 0"></iframe></div>
</div></body>
