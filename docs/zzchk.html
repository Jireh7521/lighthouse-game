<!doctype html><meta charset=utf-8><title>check</title>
<body style="margin:0;background:#111;color:#0f0;font:700 14px monospace;padding:10px">
<pre id="o">waiting</pre>
<iframe id="f" src="index.html" style="width:960px;height:620px;border:1px solid #333"></iframe>
<script>
var f = document.getElementById('f'), o = document.getElementById('o');
f.onload = function () {
  setTimeout(function () {
    try {
      var w = f.contentWindow, d = w.document, b = d.getElementById('tutagain');
      o.textContent = 'stored=' + w.localStorage.getItem('lh_tut_v1') +
        ' | btn=' + (b ? 'found' : 'missing') +
        ' | hiddenAttr=' + (b ? b.hasAttribute('hidden') : '-') +
        ' | display=' + (b ? w.getComputedStyle(b).display : '-') +
        ' | w=' + (b ? Math.round(b.getBoundingClientRect().width) : '-') +
        ' | cssTiny=' + (b ? w.getComputedStyle(b).borderRadius : '-');
    } catch (e) { o.textContent = 'threw: ' + e.name + ' ' + e.message; }
  }, 3000);
};
</script>
