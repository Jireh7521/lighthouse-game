<!doctype html><meta charset=utf-8><title>phone frames</title>
<body style="margin:0;background:#16181d;color:#dfe6f2;font:13px monospace;padding:8px">
<div style="display:flex;gap:14px;align-items:flex-start">
  <div><div style="padding-bottom:5px">upright 360x780 scaled 1.45</div>
    <iframe src="zzport.html" width="360" height="780" style="border:1px solid #39405a;display:block;transform:scale(1.45);transform-origin:0 0;margin-bottom:360px"></iframe></div>
  <div><div style="padding-bottom:5px">sideways 800x360 scaled 1.1</div>
    <iframe src="zzport.html" width="800" height="360" style="border:1px solid #39405a;display:block;transform:scale(1.1);transform-origin:0 0"></iframe></div>
</div></body>
